<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>KayArt - Hors connexion</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #eef0f5; color: #151720; font-family: Arial, sans-serif; }
      main { width: min(100%, 560px); padding: 32px; background: #fff; border: 1px solid #dfe1e8; border-radius: 6px; text-align: center; }
      img { width: 64px; height: 64px; object-fit: contain; }
      h1 { margin: 20px 0 12px; font-size: 30px; }
      p { margin: 0; color: #555a6a; line-height: 1.6; }
      button { margin-top: 24px; min-height: 44px; padding: 10px 18px; border: 0; border-radius: 3px; background: #105bc6; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" />
      <h1>Connexion indisponible</h1>
      <p>La boutique KayArt sera de nouveau accessible dès que votre connexion reviendra.</p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
