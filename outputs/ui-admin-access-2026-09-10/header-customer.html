<!doctype html><html lang="fr"><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Navigation — rendu de test customer</title><style>@import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap");

:root {
  --carbon: #1a1c1e;
  --fiber: #e5e0d5;
  --ivory: #f6f3ee;
  --paper: #ffffff;
  --metal: #6b6861;
  --primary: #1d3a4a;
  --sea: #5b8fa8;
  --accent: #b5652a;
  --sage: #8caf7e;
  --gold: #d4a853;
  --line: rgba(26, 28, 30, 0.12);
  --max: 1180px;
}

* {
  box-sizing: border-box;
}

html {
  min-width: 320px;
  color-scheme: light;
  background: var(--ivory);
}

body {
  margin: 0;
  background: var(--ivory);
  color: var(--carbon);
  font-family: "DM Sans", Arial, Helvetica, sans-serif;
  line-height: 1.5;
}

a {
  color: inherit;
  text-decoration: none;
}

button,
input,
textarea,
select {
  font: inherit;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.shell {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.route-loading-overlay {
  position: fixed;
  inset: 0;
  z-index: 120;
  display: grid;
  place-items: center;
  background: rgba(246, 243, 238, 0.68);
  backdrop-filter: blur(3px);
  cursor: progress;
  animation: route-loading-fade-in 160ms ease both;
}

.route-loading-screen {
  min-height: 58vh;
  display: grid;
  place-items: center;
  background: var(--ivory);
}

.route-loading-indicator {
  position: relative;
  width: 58px;
  height: 58px;
  display: block;
  border: 3px solid rgba(29, 58, 74, 0.16);
  border-top-color: var(--accent);
  border-right-color: var(--primary);
  border-radius: 999px;
  box-shadow: 0 18px 42px rgba(26, 28, 30, 0.14);
  animation: route-loading-spin 780ms linear infinite;
}

.route-loading-indicator::after {
  content: "";
  position: absolute;
  inset: 14px;
  border-radius: inherit;
  background: var(--paper);
  box-shadow: inset 0 0 0 1px rgba(26, 28, 30, 0.08);
}

@keyframes route-loading-fade-in {
  from {
    opacity: 0;
  }

  to {
    opacity: 1;
  }
}

@keyframes route-loading-spin {
  to {
    transform: rotate(360deg);
  }
}

.container {
  width: min(100% - 32px, var(--max));
  margin: 0 auto;
}

.site-header {
  position: sticky;
  top: 0;
  z-index: 20;
  border-bottom: 1px solid var(--line);
  background: rgba(246, 243, 238, 0.9);
  backdrop-filter: blur(14px);
}

.site-header__inner {
  min-height: 76px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}

.brand {
  display: grid;
  gap: 0;
  text-transform: uppercase;
}

.brand__name {
  font-weight: 900;
  letter-spacing: 0;
  color: var(--primary);
}

.brand__tagline {
  color: var(--metal);
  font-size: 0.72rem;
}

.nav {
  display: flex;
  align-items: center;
  gap: 22px;
  color: var(--metal);
  font-size: 0.92rem;
}

.nav a:hover,
.nav a:focus-visible {
  color: var(--primary);
}

.nav__admin-link {
  color: var(--primary);
  font-weight: 900;
}

.header-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
}

.header-actions__form {
  margin: 0;
}

.icon-link,
.button {
  min-height: 42px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 0 16px;
  text-transform: uppercase;
  font-weight: 800;
  font-size: 0.78rem;
  transition:
    background 160ms ease,
    border-color 160ms ease,
    color 160ms ease,
    transform 160ms ease;
}

.icon-link--button {
  background: transparent;
  color: inherit;
  cursor: pointer;
}

.icon-link:hover,
.button:hover {
  transform: translateY(-1px);
}

.button--primary {
  border-color: var(--accent);
  background: var(--accent);
  color: var(--paper);
}

.button--ghost {
  background: transparent;
  color: var(--primary);
}

.button--ghost:hover {
  border-color: var(--primary);
  background: rgba(29, 58, 74, 0.06);
}

.button--danger {
  border-color: rgba(156, 47, 36, 0.28);
  background: rgba(156, 47, 36, 0.08);
  color: #9c2f24;
}

.button--danger:hover {
  border-color: #9c2f24;
  background: rgba(156, 47, 36, 0.14);
}

.hero .button--ghost,
.section--light .button--ghost {
  border-color: rgba(246, 243, 238, 0.34);
  color: var(--ivory);
}

.hero .button--ghost:hover,
.section--light .button--ghost:hover {
  border-color: var(--ivory);
  background: rgba(246, 243, 238, 0.1);
}

.button:disabled {
  cursor: not-allowed;
  opacity: 0.52;
}

.hero {
  min-height: min(760px, calc(88vh - 76px));
  display: grid;
  align-items: end;
  padding: 92px 0 58px;
  border-bottom: 1px solid var(--line);
  background:
    linear-gradient(90deg, rgba(13, 18, 20, 0.86), rgba(13, 18, 20, 0.32)),
    url("https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1800&h=1100&fit=crop&auto=format") center / cover;
  color: var(--ivory);
}

.hero__content {
  display: grid;
  gap: 28px;
}

.eyebrow {
  color: var(--accent);
  font-size: 0.8rem;
  font-weight: 900;
  text-transform: uppercase;
}

.hero h1,
.page-title {
  max-width: 960px;
  margin: 0;
  font-family: "Fraunces", Georgia, serif;
  font-size: clamp(3.2rem, 9vw, 8.4rem);
  line-height: 0.94;
  letter-spacing: 0;
}

.hero p,
.lead {
  max-width: 680px;
  margin: 0;
  color: rgba(26, 28, 30, 0.72);
  font-size: 1.15rem;
}

.hero p {
  color: rgba(246, 243, 238, 0.88);
}

.hero__actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

.actions-row {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 28px;
}

.section {
  padding: 88px 0;
  border-bottom: 1px solid var(--line);
}

.section--light {
  background: var(--primary);
  color: var(--ivory);
}

.section--light .lead {
  color: rgba(246, 243, 238, 0.78);
}

.section__header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 34px;
}

.section h2 {
  max-width: 760px;
  margin: 0;
  font-family: "Fraunces", Georgia, serif;
  font-size: clamp(2rem, 5vw, 4.8rem);
  line-height: 1;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
}

.product-card,
.feature-card {
  min-height: 340px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 28px;
  padding: 26px;
  background: var(--paper);
  border-radius: 6px;
}

.section--light .product-card,
.section--light .feature-card {
  background: rgba(246, 243, 238, 0.06);
  border-color: rgba(246, 243, 238, 0.14);
}

.product-card__visual,
.feature-card__visual {
  min-height: 160px;
  overflow: hidden;
  border-radius: 4px;
  background:
    linear-gradient(135deg, rgba(29, 58, 74, 0.22), rgba(181, 101, 42, 0.12)),
    url("https://images.unsplash.com/photo-1544551763-77ef2d0cfc6c?w=900&h=600&fit=crop&auto=format") center / cover;
}

.product-card__visual img,
.feature-card__visual img,
.product-media img,
.admin-product-thumb img,
.image-uploader-item img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
  object-position: center;
}

.product-card--imperfect .product-card__visual,
.product-card--used .product-card__visual {
  background:
    linear-gradient(135deg, rgba(29, 58, 74, 0.28), rgba(212, 168, 83, 0.16)),
    url("https://images.unsplash.com/photo-1526507867740-f27f56b0df41?w=900&h=600&fit=crop&auto=format") center / cover;
}

.product-card--service .product-card__visual,
.feature-card--repair .feature-card__visual {
  background:
    linear-gradient(135deg, rgba(29, 58, 74, 0.28), rgba(91, 143, 168, 0.14)),
    url("https://images.unsplash.com/photo-1533371452382-d45a9da51ad9?w=900&h=600&fit=crop&auto=format") center / cover;
}

.feature-card--custom .feature-card__visual {
  background:
    linear-gradient(135deg, rgba(29, 58, 74, 0.32), rgba(140, 175, 126, 0.18)),
    url("https://images.unsplash.com/photo-1581092160607-ee22621dd758?w=900&h=600&fit=crop&auto=format") center / cover;
}

.feature-card--journal .feature-card__visual {
  background:
    linear-gradient(135deg, rgba(29, 58, 74, 0.24), rgba(181, 101, 42, 0.16)),
    url("https://images.unsplash.com/photo-1502791451862-7bd8c1df43a7?w=900&h=600&fit=crop&auto=format") center / cover;
}

.meta {
  color: var(--metal);
  font-size: 0.78rem;
  font-weight: 800;
  text-transform: uppercase;
}

.catalog-price {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  color: var(--carbon);
}

.catalog-price--compact {
  margin-top: -14px;
}

.catalog-price__main {
  display: inline-flex;
  margin: 0;
  color: var(--primary);
  font-size: 1.14rem;
  font-weight: 900;
}

.catalog-price s {
  color: var(--metal);
  font-size: 0.88rem;
  font-weight: 800;
}

.discount-badge {
  display: inline-flex;
  align-items: center;
  min-height: 26px;
  border-radius: 999px;
  background: rgba(181, 101, 42, 0.12);
  color: var(--accent);
  padding: 3px 8px;
  font-size: 0.74rem;
  font-weight: 900;
}

.data-table td .catalog-price {
  margin-top: 0;
}

.data-table td .catalog-price__main,
.data-table td .discount-badge {
  display: inline-flex;
  margin-top: 0;
}

.data-table td .catalog-price__main {
  color: var(--primary);
  font-size: 0.92rem;
}

.section--light .meta {
  color: rgba(246, 243, 238, 0.66);
}

.product-card h3,
.feature-card h3 {
  margin: 0;
  font-family: "Fraunces", Georgia, serif;
  font-size: 1.45rem;
  line-height: 1.08;
}

.product-card p,
.feature-card p {
  margin: 0;
  color: rgba(26, 28, 30, 0.72);
}

.section--light .product-card p,
.section--light .feature-card p {
  color: rgba(246, 243, 238, 0.72);
}

.spec-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 0;
  margin: 0;
  list-style: none;
}

.spec-list li {
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 6px 9px;
  color: var(--metal);
  font-size: 0.75rem;
}

.section--light .spec-list li {
  border-color: rgba(246, 243, 238, 0.2);
  color: rgba(246, 243, 238, 0.72);
}

.split {
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  gap: 54px;
  align-items: start;
}

.process {
  display: grid;
  gap: 1px;
  border: 1px solid var(--line);
  background: var(--line);
}

.process__item {
  display: grid;
  grid-template-columns: 72px 1fr;
  gap: 20px;
  padding: 22px;
  background: rgba(246, 243, 238, 0.06);
}

.process__number {
  color: var(--gold);
  font-weight: 900;
}

.site-footer {
  margin-top: auto;
  padding: 42px 0;
  background: var(--primary);
  color: rgba(246, 243, 238, 0.72);
}

.site-footer__inner {
  display: flex;
  justify-content: space-between;
  gap: 24px;
}

.auth-page {
  min-height: calc(100vh - 76px);
  display: flex;
  align-items: center;
}

.auth-layout {
  display: grid;
  grid-template-columns: minmax(0, 0.9fr) minmax(320px, 440px);
  align-items: center;
  gap: 48px;
}

.auth-panel {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--paper);
  box-shadow: 0 24px 58px rgba(26, 28, 30, 0.1);
  overflow: hidden;
}

.auth-panel__header {
  display: grid;
  gap: 6px;
  padding: 24px;
  border-bottom: 1px solid var(--line);
  background:
    linear-gradient(135deg, rgba(91, 143, 168, 0.14), rgba(140, 175, 126, 0.12)),
    var(--paper);
}

.auth-panel__header strong {
  color: var(--primary);
  font-size: 1.1rem;
}

.auth-panel__header p {
  margin: 0;
  color: var(--metal);
}

.auth-form {
  display: grid;
  gap: 18px;
  padding: 24px;
}

.auth-form label {
  display: grid;
  gap: 8px;
  color: var(--metal);
  font-size: 0.76rem;
  font-weight: 800;
  text-transform: uppercase;
}

.auth-form input {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--paper);
  color: var(--carbon);
  padding: 13px 14px;
  outline: none;
}

.auth-form input:focus {
  border-color: var(--accent);
}

.auth-form__submit {
  width: 100%;
  display: inline-flex;
  gap: 9px;
}

.auth-form input:disabled {
  cursor: not-allowed;
  opacity: 0.68;
}

.auth-form .form-notice {
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 12px 14px;
}

.auth-links {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 10px;
  color: var(--metal);
  font-size: 0.86rem;
  font-weight: 800;
}

.auth-links a:hover,
.auth-links a:focus-visible {
  color: var(--primary);
}

.admin-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1px;
  margin-top: 42px;
  border: 1px solid var(--line);
  background: var(--line);
}

.admin-panel {
  border: 1px solid var(--line);
  background: var(--paper);
  border-radius: 6px;
  overflow: hidden;
}

.admin-panel__header {
  padding: 24px;
  border-bottom: 1px solid var(--line);
}

.admin-panel__header p {
  max-width: 720px;
  margin: 8px 0 0;
  color: var(--metal);
}

.admin-filters {
  display: grid;
  grid-template-columns: minmax(220px, 1.5fr) repeat(3, minmax(160px, 1fr)) auto;
  gap: 12px;
  padding: 18px 24px;
  border-bottom: 1px solid var(--line);
  background: #edeae3;
}

.admin-filters label {
  display: grid;
  gap: 8px;
  color: var(--metal);
  font-size: 0.76rem;
  font-weight: 800;
  text-transform: uppercase;
}

.admin-filters input,
.admin-filters select {
  width: 100%;
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--carbon);
  padding: 12px 13px;
  outline: none;
}

.admin-filters input:focus,
.admin-filters select:focus {
  border-color: var(--accent);
}

.filter-actions {
  display: flex;
  align-items: flex-end;
  gap: 8px;
}

.table-wrap {
  overflow-x: auto;
}

.data-table {
  width: 100%;
  min-width: 920px;
  border-collapse: collapse;
}

.data-table th,
.data-table td {
  padding: 18px 20px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  vertical-align: top;
}

.data-table th {
  color: var(--metal);
  font-size: 0.76rem;
  text-transform: uppercase;
}

.data-table__row--muted {
  opacity: 0.58;
  background: #f4f1eb;
}

.data-table__row--paged {
  animation: table-row-reveal 180ms ease-out both;
}

.data-table__row--muted.data-table__row--paged {
  animation-name: table-row-muted-reveal;
}

@keyframes table-row-reveal {
  from {
    opacity: 0;
    transform: translateY(5px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes table-row-muted-reveal {
  from {
    opacity: 0;
    transform: translateY(5px);
  }

  to {
    opacity: 0.58;
    transform: translateY(0);
  }
}

.actions-cell {
  position: relative;
  width: 1%;
}

.row-actions {
  position: relative;
  display: inline-block;
}

.row-actions summary,
.row-actions__trigger {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--paper);
  color: var(--primary);
  font-size: 1rem;
  font-weight: 900;
  line-height: 1;
  cursor: pointer;
  list-style: none;
}

.row-actions summary::-webkit-details-marker {
  display: none;
}

.row-actions[open] summary,
.row-actions--open .row-actions__trigger {
  border-color: var(--accent);
  background: #f4f1eb;
}

.row-actions__menu {
  position: fixed;
  z-index: 1000;
  min-width: 158px;
  display: grid;
  gap: 2px;
  padding: 6px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--paper);
  box-shadow: 0 18px 34px rgba(26, 28, 30, 0.16);
}

.row-actions__menu form {
  margin: 0;
}

.row-actions__item {
  width: 100%;
  display: block;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: var(--carbon);
  padding: 10px 12px;
  text-align: left;
  font: inherit;
  font-size: 0.84rem;
  font-weight: 800;
  cursor: pointer;
}

.row-actions__item:hover,
.row-actions__item:focus-visible {
  background: #edeae3;
}

.row-actions__item--danger {
  color: #9c2f24;
}

.row-actions__item--disabled {
  cursor: not-allowed;
  opacity: 0.45;
}

.row-actions__item:disabled {
  color: var(--metal);
  cursor: not-allowed;
  opacity: 0.45;
}

.row-actions__item--disabled:hover,
.row-actions__item--disabled:focus-visible,
.row-actions__item:disabled:hover,
.row-actions__item:disabled:focus-visible {
  background: transparent;
}

.admin-product-cell {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 260px;
}

.admin-product-thumb {
  width: 74px;
  height: 58px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 5px;
  background:
    linear-gradient(135deg, rgba(29, 58, 74, 0.1), rgba(181, 101, 42, 0.1)),
    #edeae3;
}

.admin-product-thumb span {
  margin: 0;
  color: var(--metal);
  font-size: 0.66rem;
  font-weight: 800;
  text-align: center;
  text-transform: uppercase;
}

.data-table td span {
  display: block;
  margin-top: 4px;
  color: var(--metal);
  font-size: 0.82rem;
}

.data-table td .table-badge {
  width: fit-content;
  display: inline-flex;
  align-items: center;
  min-height: 28px;
  margin-top: 0;
  padding: 5px 10px;
  border: 1px solid transparent;
  border-radius: 999px;
  font-size: 0.74rem;
  font-weight: 900;
  letter-spacing: 0.03em;
  line-height: 1;
  text-transform: uppercase;
  white-space: nowrap;
}

.table-badge--condition-new,
.table-badge--availability-available {
  border-color: rgba(15, 118, 110, 0.28);
  background: rgba(15, 118, 110, 0.11);
  color: #0b5f5a !important;
}

.table-badge--condition-imperfect,
.table-badge--condition-used {
  border-color: rgba(196, 122, 44, 0.3);
  background: rgba(196, 122, 44, 0.13);
  color: #8a4f16 !important;
}

.table-badge--condition-service {
  border-color: rgba(124, 58, 237, 0.24);
  background: rgba(124, 58, 237, 0.1);
  color: #5b21b6 !important;
}

.table-badge--availability-draft,
.table-badge--availability-archived {
  border-color: rgba(100, 116, 139, 0.24);
  background: rgba(100, 116, 139, 0.1);
  color: #475569 !important;
}

.table-badge--availability-reserved,
.table-badge--availability-made-to-order {
  border-color: rgba(217, 119, 6, 0.28);
  background: rgba(217, 119, 6, 0.12);
  color: #92400e !important;
}

.table-badge--availability-unavailable {
  border-color: rgba(156, 47, 36, 0.24);
  background: rgba(156, 47, 36, 0.1);
  color: #9c2f24 !important;
}

.data-table td .row-actions__item {
  margin-top: 0;
  color: var(--carbon);
  font-size: 0.84rem;
}

  height: 38px;
  display: grid;
  place-items: center;
  border: 1px solid var(--admin-line, var(--line));
  border-radius: 999px;
  background: var(--admin-surface-2, var(--ivory));
  color: var(--admin-ink, var(--carbon));
  cursor: pointer;
  font-size: 1.35rem;
  line-height: 1;
}

.modal-close-button span {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
}

.admin-modal h2 {
  margin: 4px 0 0;
  font-size: 1.35rem;
  line-height: 1.12;
}

.admin-modal p {
  margin: 10px 0 0;
  color: var(--admin-muted, var(--metal));
}

.admin-modal--danger {
  border-color: rgba(156, 47, 36, 0.3);
}

.modal-eyebrow {
  color: var(--admin-accent, var(--accent));
  font-size: 0.72rem;
  font-weight: 900;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.modal-form {
  display: grid;
  gap: 18px;
}

.category-create-form,
.category-row__form {
  display: grid;
  gap: 10px;
  align-items: end;
}

.category-create-form {
  grid-template-columns: minmax(150px, 1fr) minmax(150px, 1fr) 92px 96px;
  border: 1px solid var(--admin-line, var(--line));
  border-radius: 8px;
  background: var(--admin-surface-2, #f7fafc);
  padding: 14px;
}

.category-row__form {
  grid-template-columns: minmax(130px, 0.9fr) minmax(130px, 0.9fr) 82px 90px minmax(180px, 1.1fr) auto;
}

.category-create-form label,
.category-row__form label {
  display: grid;
  gap: 7px;
  color: var(--admin-muted, var(--metal));
  font-size: 0.72rem;
  font-weight: 900;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.category-create-form input,
.category-row__form input {
  width: 100%;
  min-height: 42px;
  border: 1px solid var(--admin-line, var(--line));
  border-radius: 6px;
  background: var(--admin-surface, var(--paper));
  color: var(--admin-ink, var(--carbon));
  padding: 10px 11px;
  outline: none;
}

.category-description-field {
  grid-column: 1 / -2;
}

.category-toggle {
  min-height: 42px;
  display: flex !important;
  align-items: center;
  gap: 8px !important;
  border: 1px solid var(--admin-line, var(--line));
  border-radius: 6px;
  background: var(--admin-surface, var(--paper));
  padding: 0 10px;
}

.category-toggle input {
  width: auto;
  min-height: auto;
}

.category-list {
  display: grid;
  gap: 10px;
}

.category-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 10px;
  align-items: end;
  border: 1px solid var(--admin-line, var(--line));
  border-radius: 8px;
  padding: 12px;
}

.modal-form label {
  display: grid;
  gap: 8px;
  color: var(--admin-muted, var(--metal));
  font-size: 0.78rem;
  font-weight: 900;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.stock-adjuster {
  display: grid;
  grid-template-columns: 64px 1fr 64px;
  gap: 8px;
}

.stock-adjuster button,
.stock-adjuster input {
  min-height: 46px;
  border: 1px solid var(--admin-line, var(--line));
  border-radius: 6px;
  background: var(--admin-surface-2, var(--ivory));
  color: var(--admin-ink, var(--carbon));
  text-align: center;
  font: inherit;
  font-weight: 900;
}

.stock-adjuster input {
  background: var(--admin-surface, var(--paper));
  appearance: textfield;
  -moz-appearance: textfield;
}

.stock-adjuster input::-webkit-inner-spin-button,
.stock-adjuster input::-webkit-outer-spin-button {
  margin: 0;
  -webkit-appearance: none;
}

.modal-form input,
.modal-form select,
.modal-form textarea {
  width: 100%;
  min-height: 44px;
  border: 1px solid var(--admin-line, var(--line));
  border-radius: 6px;
  background: var(--admin-surface, var(--paper));
  color: var(--admin-ink, var(--carbon));
  padding: 10px 12px;
  outline: none;
}

.modal-form input:focus,
.modal-form select:focus,
.modal-form textarea:focus {
  border-color: var(--admin-accent, var(--accent));
  box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
}

.order-form {
  gap: 20px;
}

.order-form-grid {
  display: grid;
  grid-template-columns: minmax(220px, 0.9fr) minmax(260px, 1.1fr);
  gap: 12px;
}

.order-lines {
  display: grid;
  gap: 10px;
}

.order-line {
  display: grid;
  grid-template-columns: minmax(260px, 1fr) 120px 44px;
  gap: 10px;
  align-items: end;
  border: 1px solid var(--admin-line, var(--line));
  border-radius: 8px;
  background: var(--admin-surface-2, #f7fafc);
  padding: 12px;
}

.order-line input[type="number"] {
  text-align: center;
  appearance: textfield;
  -moz-appearance: textfield;
}

.order-line input[type="number"]::-webkit-inner-spin-button,
.order-line input[type="number"]::-webkit-outer-spin-button {
  margin: 0;
  -webkit-appearance: none;
}

.order-line__remove {
  width: 44px;
  min-height: 44px;
  padding: 0;
  font-size: 1.2rem;
}

.order-line__meta {
  grid-column: 1 / -1;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  color: var(--admin-muted, var(--metal));
  font-size: 0.82rem;
  font-weight: 800;
}

.order-line__meta strong {
  color: #9c2f24;
}

.order-add-line {
  width: fit-content;
}

.order-total {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  border: 1px solid rgba(15, 118, 110, 0.24);
  border-radius: 8px;
  background: rgba(15, 118, 110, 0.08);
  padding: 16px;
}

.order-total span {
  color: var(--admin-muted, var(--metal));
  font-size: 0.78rem;
  font-weight: 900;
  text-transform: uppercase;
}

.order-total strong {
  color: var(--admin-accent-strong, var(--primary));
  font-size: 1.35rem;
}

.admin-orders-table {
  min-width: 940px;
}

.order-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.order-actions form {
  margin: 0;
}

.order-actions__button {
  min-height: 36px;
  padding: 0 10px;
  font-size: 0.72rem;
}

.order-number-cell,
.order-items-list {
  display: grid;
  gap: 4px;
}

.order-number-cell span {
  color: var(--admin-muted, var(--metal));
  font-size: 0.82rem;
}

.order-items-list {
  padding: 0;
  margin: 0;
  list-style: none;
}

.order-items-list li {
  display: grid;
  gap: 2px;
}

.order-items-list li + li {
  margin-top: 8px;
}

.order-items-list span {
  color: var(--admin-muted, var(--metal));
  font-size: 0.82rem;
}

.table-badge--order-completed,
.table-badge--payment-paid {
  border-color: rgba(15, 118, 110, 0.28);
  background: rgba(15, 118, 110, 0.11);
  color: #0b5f5a !important;
}

.table-badge--order-pending,
.table-badge--order-preparing,
.table-badge--order-ready,
.table-badge--payment-pending {
  border-color: rgba(217, 119, 6, 0.28);
  background: rgba(217, 119, 6, 0.12);
  color: #92400e !important;
}

.table-badge--order-cancelled,
.table-badge--order-refunded,
.table-badge--payment-cancelled,
.table-badge--payment-failed,
.table-badge--payment-refunded {
  border-color: rgba(156, 47, 36, 0.24);
  background: rgba(156, 47, 36, 0.1);
  color: #9c2f24 !important;
}

.table-badge--order-paid,
.table-badge--order-shipped {
  border-color: rgba(124, 58, 237, 0.24);
  background: rgba(124, 58, 237, 0.1);
  color: #5b21b6 !important;
}

.table-badge--order-fictive {
  border-color: rgba(124, 58, 237, 0.24);
  background: rgba(124, 58, 237, 0.1);
  color: #5b21b6 !important;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}

.admin-page {
  --admin-bg: #eef3f6;
  --admin-surface: #ffffff;
  --admin-surface-2: #f7fafc;
  --admin-ink: #111827;
  --admin-muted: #64748b;
  --admin-line: #d7e1e8;
  --admin-accent: #0f766e;
  --admin-accent-strong: #0b5f5a;
  --admin-accent-soft: rgba(15, 118, 110, 0.1);
  --admin-warn: #c47a2c;
  background:
    linear-gradient(180deg, #f8fbfc 0, var(--admin-bg) 320px),
    var(--admin-bg);
  border-bottom-color: var(--admin-line);
  color: var(--admin-ink);
}

.admin-page .page-title {
  font-family: "DM Sans", Arial, Helvetica, sans-serif;
  font-size: clamp(2.35rem, 5vw, 4.65rem);
  font-weight: 900;
  line-height: 0.98;
  color: var(--admin-ink);
}

.admin-page .eyebrow {
  color: var(--admin-accent);
  letter-spacing: 0.08em;
}

.admin-page .lead {
  color: var(--admin-muted);
}

.admin-page .button--primary {
  border-color: var(--admin-accent);
  background: var(--admin-accent);
  color: #ffffff;
}

.admin-page .button--primary:hover {
  border-color: var(--admin-accent-strong);
  background: var(--admin-accent-strong);
}

.admin-page .button--ghost {
  border-color: var(--admin-line);
  background: var(--admin-surface);
  color: var(--admin-ink);
}

.admin-page .button--ghost:hover {
  border-color: var(--admin-accent);
  background: var(--admin-accent-soft);
  color: var(--admin-accent-strong);
}

.admin-page .admin-grid {
  gap: 14px;
  border: 0;
  background: transparent;
}

.admin-page .feature-card {
  min-height: 240px;
  border: 1px solid var(--admin-line);
  background: var(--admin-surface);
  box-shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
}

.admin-page .admin-panel {
  border: 1px solid var(--admin-line);
  background: var(--admin-surface);
  box-shadow: 0 22px 60px rgba(15, 23, 42, 0.1);
}

.admin-page .admin-panel__header {
  border-bottom-color: var(--admin-line);
  background:
    linear-gradient(90deg, rgba(15, 118, 110, 0.08), transparent 46%),
    var(--admin-surface);
}

.admin-page .admin-panel__header p,
.admin-page .admin-panel__note,
.admin-page .meta,
.admin-page .data-table th,
.admin-page .data-table td span {
  color: var(--admin-muted);
}

.admin-page .admin-filters {
  border-bottom-color: var(--admin-line);
  background: var(--admin-surface-2);
}

.admin-page .admin-filters label,
.admin-page .admin-form label {
  color: var(--admin-muted);
  letter-spacing: 0.04em;
}

.admin-page .admin-filters input,
.admin-page .admin-filters select,
.admin-page .admin-form input,
.admin-page .admin-form select,
.admin-page .admin-form textarea {
  border-color: var(--admin-line);
  border-radius: 6px;
  background: var(--admin-surface);
  color: var(--admin-ink);
  transition:
    border-color 160ms ease,
    box-shadow 160ms ease,
    background 160ms ease;
}

.admin-page .admin-filters input:focus,
.admin-page .admin-filters select:focus,
.admin-page .admin-form input:focus,
.admin-page .admin-form select:focus,
.admin-page .admin-form textarea:focus {
  border-color: var(--admin-accent);
  box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
}

.admin-page .data-table {
  min-width: 980px;
}

.admin-page .data-table th,
.admin-page .data-table td {
  border-bottom-color: var(--admin-line);
}

.admin-page .data-table tbody tr {
  background: var(--admin-surface);
}

.admin-page .data-table tbody tr:hover {
  background: #f9fbfc;
}

.admin-page .data-table__row--muted {
  background: #f2f5f7 !important;
}

.admin-page .admin-product-thumb {
  border-color: var(--admin-line);
  background:
    linear-gradient(135deg, rgba(15, 118, 110, 0.09), rgba(17, 24, 39, 0.04)),
    #f4f7f9;
}

.admin-page .row-actions summary,
.admin-page .row-actions__trigger {
  border-color: var(--admin-line);
  background: var(--admin-surface);
  color: var(--admin-ink);
}

.admin-page .row-actions[open] summary,
.admin-page .row-actions--open .row-actions__trigger,
.admin-page .row-actions summary:hover,
.admin-page .row-actions__trigger:hover {
  border-color: var(--admin-accent);
  background: var(--admin-accent-soft);
  color: var(--admin-accent-strong);
}

.admin-page .row-actions__menu {
  border-color: var(--admin-line);
  background: var(--admin-surface);
  box-shadow: 0 24px 48px rgba(15, 23, 42, 0.16);
}

.admin-page .row-actions__item:hover,
.admin-page .row-actions__item:focus-visible {
  background: var(--admin-accent-soft);
}

.admin-page .form-panel {
  margin-top: 30px;
}

.admin-page .admin-form {
  gap: 14px;
  background: var(--admin-bg);
  padding: 16px;
}

.admin-page .form-steps {
  gap: 8px;
  border: 1px solid var(--admin-line);
  border-radius: 8px;
  background: var(--admin-surface);
  padding: 10px;
  box-shadow: 0 10px 24px rgba(15, 23, 42, 0.05);
}

.admin-page .form-step {
  min-height: 44px;
  border: 1px solid var(--admin-line);
  border-radius: 6px;
  background: var(--admin-surface-2);
  color: var(--admin-muted);
  font-size: 0.72rem;
}

.admin-page .form-step[data-state="done"] {
  border-color: rgba(15, 118, 110, 0.32);
  background: var(--admin-accent-soft);
  color: var(--admin-accent-strong);
}

.admin-page .form-step[aria-current="step"] {
  border-color: var(--admin-accent);
  background: var(--admin-accent);
  color: #ffffff;
}

.admin-page .form-step:disabled {
  opacity: 0.42;
}

.admin-page .admin-form fieldset,
.admin-page .form-stage {
  border: 1px solid var(--admin-line);
  border-left: 4px solid var(--admin-accent);
  border-radius: 8px;
  background: var(--admin-surface);
  box-shadow: 0 10px 24px rgba(15, 23, 42, 0.05);
}

.admin-page .form-stage--locked {
  border-left-color: #aab8c2;
  background: #f2f6f8;
  filter: none;
  opacity: 0.46;
  transform: none;
}

.admin-page .admin-form legend {
  color: var(--admin-accent);
  letter-spacing: 0.06em;
}

.admin-page .price-preview {
  border-color: rgba(15, 118, 110, 0.24);
  background:
    linear-gradient(135deg, rgba(15, 118, 110, 0.12), rgba(17, 24, 39, 0.04)),
    #f8fbfc;
}

.admin-page .price-preview span,
.admin-page .price-preview small,
.admin-page .form-hint,
.admin-page .drop-zone small,
.admin-page .image-uploader-item p {
  color: var(--admin-muted);
}

.admin-page .price-preview strong {
  color: var(--admin-accent-strong);
}

.admin-page .model-preview {
  border-color: var(--admin-line);
  background: var(--admin-surface-2);
}

.admin-page .model-preview__image {
  border-color: var(--admin-line);
  background:
    linear-gradient(135deg, rgba(15, 118, 110, 0.09), rgba(17, 24, 39, 0.04)),
    #f4f7f9;
}

.admin-page .model-preview p,
.admin-page .model-preview__image span {
  color: var(--admin-muted);
}

.imperfect-form input[type="number"] {
  appearance: textfield;
  -moz-appearance: textfield;
}

.imperfect-form input[type="number"]::-webkit-inner-spin-button,
.imperfect-form input[type="number"]::-webkit-outer-spin-button {
  margin: 0;
  -webkit-appearance: none;
}

.admin-page .drop-zone {
  border-color: rgba(15, 118, 110, 0.32);
  background:
    linear-gradient(135deg, rgba(15, 118, 110, 0.08), rgba(59, 130, 246, 0.06)),
    #f8fbfc;
  color: var(--admin-accent-strong);
}

.admin-page .drop-zone--active {
  border-color: var(--admin-accent);
  background:
    linear-gradient(135deg, rgba(15, 118, 110, 0.15), rgba(59, 130, 246, 0.1)),
    #f8fbfc;
}

.admin-page .image-uploader-item,
.admin-page .existing-image,
.admin-page .check-grid label {
  border-color: var(--admin-line);
  background: var(--admin-surface);
}

.admin-page .existing-image figcaption {
  color: var(--admin-muted);
}

.admin-page .existing-image--primary {
  border-color: rgba(15, 118, 110, 0.42);
}

.admin-page .cover-button[aria-pressed="true"] {
  background: var(--admin-accent);
}

.admin-page .form-actions {
  border: 1px solid var(--admin-line);
  border-radius: 8px;
  background: var(--admin-surface);
  box-shadow: 0 10px 24px rgba(15, 23, 42, 0.05);
}

.admin-page .stock-badge--available {
  border-color: rgba(15, 118, 110, 0.38);
  color: var(--admin-accent-strong) !important;
}

.admin-page .catalog-price__main {
  color: var(--admin-accent-strong);
}

.admin-page .discount-badge {
  background: rgba(196, 122, 44, 0.12);
  color: var(--admin-warn);
}

@media (max-width: 860px) {
  .site-header__inner {
    align-items: start;
    flex-direction: column;
    padding: 18px 0;
  }

  .nav {
    width: 100%;
    flex-wrap: wrap;
    overflow-x: visible;
    padding-bottom: 4px;
  }

  .hero {
    min-height: auto;
    padding: 72px 0 44px;
  }

  .section__header,
  .site-footer__inner {
    align-items: flex-start;
    flex-direction: column;
  }

  .grid,
  .auth-layout,
  .admin-grid,
  .admin-filters,
  .form-grid,
  .check-grid,
  .product-detail-layout,
  .product-content-grid,
  .split {
    grid-template-columns: 1fr;
  }

  .product-summary-card {
    position: static;
  }

  .product-gallery__stage {
    min-height: 360px;
  }

  .product-gallery__thumbs {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .product-facts,
  .defect-gallery {
    grid-template-columns: 1fr;
  }

  .category-create-form,
  .category-row,
  .category-row__form,
  .order-form-grid,
  .order-line {
    grid-template-columns: 1fr;
  }

  .category-description-field,
  .order-line__meta {
    grid-column: auto;
  }

  .filter-actions {
    align-items: stretch;
    flex-direction: column;
  }

  .product-pagination {
    align-items: stretch;
    flex-direction: column;
  }

  .product-pagination__button {
    width: 100%;
  }

  .form-actions {
    align-items: flex-start;
    flex-direction: column;
  }

  .stock-form {
    grid-template-columns: 1fr;
    min-width: 240px;
  }

  .image-uploader-grid,
  .existing-images,
  .product-thumbnails {
    grid-template-columns: 1fr 1fr;
  }

  .model-preview {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 720px) {
  .admin-page {
    padding-top: 38px;
    padding-bottom: 50px;
  }

  .admin-page .section__header {
    gap: 18px;
    margin-bottom: 24px;
  }

  .admin-page .page-title {
    font-size: clamp(2.1rem, 18vw, 3.2rem);
    line-height: 0.96;
  }

  .admin-page .lead {
    font-size: 0.98rem;
  }

  .admin-page .header-actions {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
  }

  .admin-page .header-actions .button,
  .admin-page .header-actions button {
    width: 100%;
  }

  .admin-page .feature-card {
    min-height: auto;
    padding: 22px;
  }

  .admin-page .admin-panel {
    overflow: visible;
    border-radius: 8px;
  }

  .admin-page .admin-panel__header {
    padding: 18px;
  }

  .admin-page .admin-panel__header strong {
    display: block;
    font-size: 1rem;
    line-height: 1.2;
  }

  .admin-page .admin-panel__header p,
  .admin-page .admin-panel__note {
    font-size: 0.9rem;
  }

  .admin-page .form-notice {
    padding: 14px 16px;
    font-size: 0.9rem;
  }

  .admin-page .admin-filters {
    gap: 12px;
    padding: 16px;
  }

  .admin-page .filter-actions .button {
    width: 100%;
  }

  .admin-page .table-wrap {
    overflow: visible;
  }

  .admin-page .data-table,
  .admin-page .admin-orders-table {
    min-width: 0;
    display: block;
  }

  .admin-page .data-table thead {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
  }

  .admin-page .data-table tbody {
    display: grid;
    gap: 12px;
    padding: 12px;
    background: var(--admin-bg);
  }

  .admin-page .data-table tbody tr {
    display: grid;
    overflow: hidden;
    border: 1px solid var(--admin-line);
    border-radius: 8px;
    background: var(--admin-surface);
    box-shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
  }

  .admin-page .data-table tbody tr:hover {
    background: var(--admin-surface);
  }

  .admin-page .data-table th,
  .admin-page .data-table td {
    padding: 0;
